<!doctype html>

  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: content reaches the rounded corners and the app pads for the home
         indicator itself. maximum-scale=1 stops iOS zooming in on text fields (pinch zoom still works). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Settle Down: a calm family budget." />

    <!-- Installable web app (Add to Home Screen) -->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Settle Down" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="format-detection" content="telephone=no" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* Grove cream, so there's never a white flash before the app draws. */
        background-color: #F6F4EE;
        /* No grey flash on tap, no callout on long-press, no pull-to-refresh bounce. */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0D1712;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Settle Down needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
